COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS="صلاحيات النطاق"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_DESC="أذونات النطاق هذه تسمح لإيزيبلوقبالنشر التلقائي لمحتوى المدونة إلى صفحات ومجموعات فيسبوك. حدد الأذونات التي تريد استخدامها.<br /> إذا كان تطبيق فيسبوك الخاص بك في الوضع العام، تأكد من أن الأذونات المحددة قد تمت الموافقة عليها بالفعل من قبل الفيسبوك قبل استخدامها في عملية المصادقة أدناه."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="قام فيسبوك بتحديث صفحة API منذ <b>مايو 6 2020</b> وأصدر ستة أذونات جديدة للصفحة لاستبدال <b>publish_page</b> و <b>manage_page</b>.<br \>للفوز التلقائي لصفحات فيسبوك، ستحتاج إلى <b>صفحات_manage_post</b> و <b>صفحات_read_engagement</b> الأذونات. هذا لتطبيقات فيسبوك التي تم إنشاؤها <b>بعد 6 مايو 2020</b>. التطبيقات التي تم إنشاؤها <b>قبل 6 مايو 2020</b> لا تزال تستخدم أذونات النطاق القديمة حتى <b>مايو 2022</b>.<br \>يرجى زيارة هذه الصفحة <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'></a> لمزيد من المعلومات."
