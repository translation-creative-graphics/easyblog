COM_EASYBLOG_THEME_TIMELESS_DESC="Tijdloos toont een zeer mooie kalender zoals het icoon op de blogpost waardoor het een zeer elegante afwerking krijgt. Het verschil tussen tijdloos en de rest van het thema is dat het een mini kalender in plaats van een avatar gebruikt."
