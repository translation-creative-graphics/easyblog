COM_EASYBLOG_THEME_LITHIUM_DESC="Dit thema bevat de techniek van het gebruik van blogafbeeldingen waar je blogs kunt plaatsen op de gewenste locatie. Dit thema is alleen beschikbaar voor gebruikers die zijn geabonneerd op het <strong>Onbeperkte abonnement</strong>.<br /><br /><strong>Houd er rekening mee dat dit thema geen foto's van gebruikersprofiel weergeeft.</strong>"
