COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_USE_AUTHOR_URL_DESC="Esta opción permite a los autores ingresar su propia URL de página de Facebook. Cuando una publicación se comparte en Facebook, la publicación de Facebook se vincularía a su página de Facebook."
