COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS="Permisos de alcance"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_DESC="Estos permisos de alcance permiten que EasyBlog publique automáticamente el contenido del blog en las páginas y grupos de Facebook. Seleccione los permisos que desea usar.<br /> Si su aplicación de Facebook está en modo público, asegúrese de que los permisos seleccionados ya estén aprobados por Facebook. Antes de usarlos en el proceso de autenticación a continuación "
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="Facebook ha actualizado su API de página desde el <b>6 de mayo de, 2020</b> y lanzó seis nuevos permisos de página para reemplazar <b>publish_pages</b> y <b>manage_pages</b>.<br \\>Para publicar automáticamente en páginas de Facebook, necesitará los permisos de <b>pages_manage_posts</b> y <b>pages_read_engagement</b>. Esto es para las aplicaciones de Facebook creadas <b>después del 6 de mayo de, 2020</b>. Aplicaciones creadas <b>antes del 6 de mayo de 2020</b> todavía puede usar los permisos de alcance anteriores hasta <b>Mayo 2022</b>.<br \\>Por favor visita esta <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'>página</a> para mayor información."
