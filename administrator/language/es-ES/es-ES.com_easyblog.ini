COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OAUTH_REDIRECT_URI="URI de redireccionamiento de Oauth"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OAUTH_REDIRECT_URI_DESC="Copie estos oauth redirect uri y configúrelos en su aplicación de Facebook <b>Campo de URI de redirección OAuth válido</b>"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OAUTH_REDIRECT_URI_INFO="A partir de <b>March 2018</b>, Facebook estará <a href='https://developers.facebook.com/blog/post/2017/12/18/strict-uri-matching/' target='_blank'>imponiendo una estricta coincidencia de URI</a>. Deberá copiar los enlaces a continuación y agregarlos en la sección URI de redireccionamiento de OAuth válidos de la aplicación de Facebook.."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OPENGRAPH_IMAGEAVATAR="Usar imagen de avatar como imagen opengraph"
