COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="Facebook оновив свій API сторінки <b>з 6 травня 2020 року</b> і випустив шість нових дозволів сторінки для заміни <b>publish_pages</b> і <b>manage_pages</b>.<br \>Для автоматичної публікації на сторінках Facebook вам знадобляться <b>pages_manage_posts</b> та <b>pages_read_engagement</b> дозволи. Це для додатків Facebook, <b>створених після 6 травня 2020 року</b>. <b>Додатки, створені до 6 травня 2020 року,</b> можуть як і раніше використовувати старі дозволи області до <b>травня 2022 року.</b><br \>Будь ласка, відвідайте цю <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'>сторінку</a> для отримання додаткової інформації."
