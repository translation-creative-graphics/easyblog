COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OAUTH_REDIRECT_URI_INFO="<b>Mart 2018</b> tarihinden itibaren Facebook, <a href='https://developers.facebook.com/blog/post/2017/12/18/strict-uri-matching/' target='_blank'>sıkı URI eşleştirmesi uygulamaktadır</a>. Aşağıdaki bağlantıları kopyalamanız ve Facebook uygulamasının Geçerli OAuth yönlendirme URI'leri bölümüne eklemeniz gerekir."
