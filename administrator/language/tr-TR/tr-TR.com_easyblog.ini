COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_DESC="Bu kapsam izinleri, EasyBlog'un blog içeriğini Facebook Sayfalarına ve Gruplarına otomatik olarak göndermesine izin verir. Kullanmak istediğiniz izinleri seçin. <br /> Facebook uygulamanız herkese açık moddaysa, aşağıdaki kimlik doğrulama işleminde kullanmadan önce seçilen izinlerin zaten Facebook tarafından onaylandığından emin olun."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="Facebook, sayfa API'larını <b> 6 Mayıs 2020 </b> tarihinden bu yana güncelledi ve <b> publish_pages </b> ve <b> manage_pages </b> sayfalarının yerini almak için altı yeni sayfa izni yayınladı. <br \> Facebook sayfalarına otomatik olarak gönderirken, <b> pages_manage_posts </b> ve <b> pages_read_engagement </b> izinlerine ihtiyacınız olacaktır. Bu, <b> 6 Mayıs 2020 </b> tarihinden sonra oluşturulan Facebook uygulamaları içindir. <br \> Daha fazla bilgi için lütfen <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'>bu sayfayı</a> ziyaret edin."
