COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="Το Facebook έχει ενημερώσει τη Σελίδα API τους από το <b>Μαΐου 6, 2020</b> και κυκλοφόρησε έξι νέα δικαιώματα σελίδας για αντικατάσταση <b>publish_pages</b> και <b>manage_pages</b>.<br \>Για την αυτόματη τοποθέτηση σε σελίδες Facebook, θα χρειαστείτε τα <b>pages_manage_posts</b> και <b>pages_read_engagement</b> δικαιώματα. Αυτό είναι για τις εφαρμογές Facebook που δημιουργήθηκαν <b>μετά τις 6 Μαΐου 2020</b>. Οι εφαρμογές που δημιουργήθηκαν <b>πριν από τις 6 Μαΐου 2020</b> μπορούν να χρησιμοποιήσουν τα παλιά δικαιώματα έως τις <b>Μαΐου 2022</b>.<br \>Παρακαλούμε επισκεφθείτε αυτή τη σελίδα <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'></a> για περισσότερες πληροφορίες."
