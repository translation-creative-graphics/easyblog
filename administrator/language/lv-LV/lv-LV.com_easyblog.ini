COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_NOTIFICATIONS_NEW_BLOG_DESC="Kad tiek publicēts jauns bloga ieraksts, „CRE8 Blog” par to paziņo lietotājiem, kuri ir abonējuši šo vietni un kategoriju, izmantojot „CRE8 Discuss” paziņojumus"
