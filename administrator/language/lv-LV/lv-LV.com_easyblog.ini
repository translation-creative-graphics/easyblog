COM_EASYBLOG_SETTINGS_INTEGRATIONS_SUBTAB_EASYSOCIAL="CRE8 Social"
COM_EASYBLOG_EASYSOCIAL_INFO="CRE8 Social ir revolucionārs sociālā tīkla paplašinājums Joomla! Tas ietver ļoti lielisku profilu sistēmu, draugu sistēmu, sarunas un neskaitāmas citas funkcijas. CRE8 Social noteikti palīdzēs jums izveidot lielisku sociālā tīkla vietni, izmantojot Joomla!"
COM_EASYBLOG_SIGNUP_WITH_EASYSOCIAL="Iegūstiet CRE8 Social jau tagad!"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_GENERAL_DESC="Šajā sadaļā ir aprakstīta vispārējā integrācija ar CRE8 Social"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR="Parādīt CRE8 sociālo tīklu paziņojumu joslu"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR_DESC="Ja šī funkcija ir ieslēgta, CRE8 Social paziņojumu josla tiks parādīta virs CRE8 Blog rīkjoslas."
COM_EASYBLOG_SETTINGS_COMMENTS_EASYSOCIAL_COMMENTS="CRE8 Sociālo tīklu komentāri"
COM_EASYBLOG_SETTINGS_COMMENTS_EASYSOCIAL_COMMENTS_DESC="Ja šī funkcija ir ieslēgta, sistēma izmantos CRE8 Social komentāru sistēmu"
COM_EASYBLOG_EASYSOCIAL_NOTIFICATIONS_INFO="Izmantojot paziņojumu iestatījumus, jūs varēsiet kontrolēt, kādā veidā jādarbojas paziņojumu integrācijai ar CRE8 Social."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_NEW_COMMENT_DESC="Ja šī opcija ir ieslēgta, bloga ieraksta abonenti tiks informēti, izmantojot CRE8 Social iekšējo paziņojumu sistēmu, kad pie bloga ieraksta tiks publicēts jauns komentārs."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_COMMENT_REPLY_DESC="Ja šī opcija ir ieslēgta, komentāra autors saņems paziņojumu caur CRE8 Social iekšējo paziņojumu sistēmu, kad uz viņa komentāru bloga ierakstā tiks sniegta atbilde."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_NEW_RATING_DESC="Ja šī opcija ir ieslēgta, bloga ieraksta abonenti tiks informēti, izmantojot CRE8 Social iekšējo paziņojumu sistēmu, kad bloga ierakstam tiks piešķirts jauns vērtējums."
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_NEW_REACTION_DESC="Ja šī opcija ir ieslēgta, bloga ieraksta autors saņems paziņojumu, izmantojot CRE8 Social iekšējo paziņojumu sistēmu, kad bloga ierakstam tiks pievienota jauna reakcija."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_PROFILE_MODIFY_EDIT_PROFILE_LINK="Izmanto CRE8 Social profila rediģēšanas saiti"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_PROFILE_MODIFY_EDIT_PROFILE_LINK_DESC="Ja šī opcija ir ieslēgta, CRE8 Blog savienos saiti „Rediģēt profilu” ar CRE8 Social veidlapu."
COM_EASYBLOG_EASYSOCIAL="CRE8 Social"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_SEARCH_DESC="Konfigurējiet blogu meklēšanas darbību CRE8 Social"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_INDEXER_INDEX_NEW_POST_DESC="Ja šī funkcija ir ieslēgta, jauni bloga ieraksti tiks pievienoti CRE8 Social indeksētājam."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_INDEXER_INDEX_NEW_POST_LENGTH_DESC="Norādiet satura garumu, kas jāindeksē CRE8 Social indeksētājā."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_MEDIA_INFO="CRE8 Blog ļauj integrēt lietotāju albumus no CRE8 Social CRE8 Blog multivides pārvaldniekā. Aktivizējot šo opciju, lietotāji var ievietot albumus kā galerijas vai ievietot fotogrāfijas no saviem albumiem."
COM_EASYBLOG_SETTINGS_TOOLBAR_EASYSOCIAL_USE_MODULE_INFO="Šī opcija vairs netiek atbalstīta. Konfigurējiet moduli „<b>CRE8 Social Toolbar</b>” tā, lai tas tiktu parādīts pozīcijā „<b>easyblog-before-toolbar</b>”."
COM_EASYBLOG_INSTALLATION_SITE_MENU_EXISTS="CRE8 Social vietnes izvēlne jau ir izveidota. To izlaižam."
COM_EASYBLOG_SETTINGS_COMPOSER_POST_OPTIONS_CATEGORY_MOVE_DATE="Atļaut kategorijas pārvietošanas datuma maiņu"
COM_EASYBLOG_SETTINGS_COMPOSER_POST_OPTIONS_CATEGORY_MOVE_DATE_DESC="Šī opcija nosaka, vai autors var ieplānot, ka ieraksts nākotnē tiks automātiski pārvietots uz citu kategoriju, to neatsaucot no publicēšanas vai nearkivējot."
COM_EB_SETTINGS_DASHBOARD_HEADER_OFFSET_DESC="Noteikt afiksa virsraksta novirzi no lapas augšas. Pielāgojiet novirzi (pikseļos), ja vietnē ir fiksēts augšējais elements, piemēram, CRE8 Social rīkjosla „Docker“."
COM_EB_SETTINGS_READING_PROGRESS_OFFSET_DESC="Noteikt novirzi no lapas augšas. Pielāgojiet novirzi (pikseļos), ja vietnē ir fiksēts augšējais elements, piemēram, CRE8 Social rīkjosla „Docker“."
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR="CRE8 sociālo tīklu izvēlnes parādīšana CRE8 bloga rīkjoslā"
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR_DESC="Šī opcija nosaka, vai CRE8 Social izvēlnes elementi ir jāparāda CRE8 Blog rīkjoslas nolaižamajā izvēlnē"
COM_EB_SETTINGS_INTEGRATIONS_EASYDISCUSS_TOOLBAR="Parādīt CRE8 diskusiju izvēlnes CRE8 bloga rīkjoslā"
COM_EB_SETTINGS_INTEGRATIONS_EASYDISCUSS_TOOLBAR_DESC="Šī opcija nosaka, vai CRE8 Discuss izvēlnes elementi ir jāparāda CRE8 Blog izvēlnē rīkjoslā"
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_PRIVACY="Izmantojiet funkciju „Privātums” no CRE8 Social"
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_PRIVACY_DESC="Šī opcija nosaka, vai CRE8 Social privātuma iestatījumi ir jāpārnes arī uz CRE8 Blog"
COM_EB_SETTINGS_INTEGRATION_EASYSOCIAL_STREAM_DESC="Konfigurējiet bloga plūsmas vispārējo darbību CRE8 Social"
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_TITLE="Ārējā satura privātums"
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_INFO="Pārvaldiet, kā jūsu blogā tiek attēlots trešo pušu pakalpojumu (YouTube, TikTok, X, Facebook, Instagram un citi) iegultais saturs."
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_CONSENT_ENABLE="Ārējā/ievietojamā satura maskēšana"
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_CONSENT_ENABLE_DESC="Ja šī funkcija ir ieslēgta, ievietojamie bloki (YouTube, TikTok, X, Facebook, Instagram, Vimeo un citi) tiek aizstāti ar vietas turētāju, un faktiskais trešo pušu saturs tiek ielādēts tikai tad, kad apmeklētājs skaidri noklikšķina, lai to apskatītu. Tas attiecas uz visiem vietnes ierakstiem, tostarp uz tiem, kas publicēti pirms šīs opcijas ieslēgšanas."
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_CONSENT_ENABLE_NOTE="<b>Ieteicams, lai nodrošinātu atbilstību datu aizsardzības noteikumiem (GDPR).</b> Trešās puses pakalpojumam netiek nosūtīts neviens pieprasījums, un tas neievieto sīkdatnes, kamēr apmeklētājs nenoklikšķina, lai ielādētu saturu."
COM_EB_ASSOCIATION_MISSING="Šim ierakstam ir jābūt saistītam ar komandu, lapu, grupu vai pasākumu — viena kategorija vai viena atslēgvārda vien nepietiek. Ja ierakstam nevajadzētu būt saistītam ar kādu no šiem elementiem, iestatiet to kā privātu."
COM_EB_MIGRATOR_JOOMLA_MIGRATE_IMAGES="Kopēt attēlus ieraksta multivides mapē"
COM_EB_MIGRATOR_JOOMLA_MIGRATE_IMAGES_DESC="Kopē raksta ievada attēlu (vai pilna teksta attēlu) un visus tekstā iekļautos vietējos attēlus ieraksta mediju mapē, kā arī norāda ierakstā uz šīm kopijām. Orijinālfaili paliek savā vietā."
COM_EB_MIGRATOR_JOOMLA_IMAGE_MISSING="Attēls nav atrasts, saglabāta sākotnējā saite: %1$s (ziņa %2$s)"
COM_EB_MIGRATOR_JOOMLA_IMAGE_FAILED="Attēlu neizdevās kopēt, saglabāta sākotnējā saite: %1$s (ziņojums %2$s)"
COM_EB_MIGRATOR_JOOMLA_ARTICLE_FAILED="Migrācija tika pārtraukta pie Joomla raksta %1$s: %2$s"
COM_EB_SETTINGS_TRUNCATION_SPLIT_POSTS="Turklāt saīsināt ierakstus ar „Lasīt vairāk”"
COM_EB_SETTINGS_TRUNCATION_SPLIT_POSTS_DESC="Ierakstiem ar „lasīt vairāk” sadalījumu parasti sarakstos tiek parādīts viss ievads. Aktivizējiet šo opciju, lai saīsinātu arī šo ievadu, ja tas pārsniedz saīsināšanas limitu."
