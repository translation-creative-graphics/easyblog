COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_NOTIFICATIONS_DESC="Reāllaika paziņojumi lietotnē „CRE8 Discuss“ ļauj jaunam paziņojumam parādīties lietotnē „CRE8 Discuss“ bez lapas pārlādēšanas."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_DESC="CRE8 Discuss ir jautājumu un atbilžu komponente Joomla sistēmai. Pirms šo opciju aktivizēšanas, lūdzu, instalējiet CRE8 Discuss noteikumu instalētāju."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_POINTS_DESC="Ja šī funkcija ir ieslēgta, CRE8 Blog mēģinās pievienot punktus CRE8 Discuss, kad tiek izraisītas darbības."
