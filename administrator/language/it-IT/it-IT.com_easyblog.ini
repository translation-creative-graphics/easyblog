COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OAUTH_REDIRECT_URI_DESC="Copia questi oauth o reindirizza uri e imposta la tua app di Facebook <b> URL di reindirizzamento OAuth validi </b>"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OAUTH_REDIRECT_URI_INFO="A partire da <b>marzo 2018</b>, Facebook <a href='https://developers.facebook.com/blog/post/2017/12/18/strict-uri-matching/' target='_blank'>imporrà una corrispondenza URI rigorosa</a>. Sarà necessario copiare i collegamenti seguenti e aggiungerli nella sezione URI di reindirizzamento OAuth valido dell'app Facebook."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OPENGRAPH_IMAGEAVATAR="Usa l'immagine avatar come immagine opengraph"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_OPENGRAPH_IMAGEAVATAR_DESC="Determina se utilizzare l'immagine avatar utente come immagine opengraph quando il contenuto del blog non ha un'immagine."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS="Autorizzazioni di ambito"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_DESC="Queste autorizzazioni dell'ambito consentono a EasyBlog di autopostare il contenuto del blog su pagine e gruppi Facebook. Seleziona le autorizzazioni che desideri utilizzare. <br /> Se la tua app di Facebook è in modalità pubblica, assicurati che le autorizzazioni selezionate siano già state approvate da Facebook prima di utilizzarle nel processo di autenticazione di seguito."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="Facebook ha aggiornato l'API Page dal <b>6 maggio 2020</b> e ha rilasciato sei nuove autorizzazioni Page per sostituire <b>publishing_page</b>s e <b>manage_pages</b>. <br \\>Per l'autoposting su pagine Facebook, avrai bisogno delle autorizzazioni <b>page_manage_posts</b> e <b>pages_read_engagement</b>. Questo è per le app di Facebook create <b>dopo il 6 maggio 2020</b>. Le app create <b>prima del 6 maggio 2020</b> possono ancora utilizzare le vecchie autorizzazioni dell'ambito fino a <b>maggio 2022</b>. <br \\>Per ulteriori informazioni, visitare <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'>questa pagina</a>."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_USE_AUTHOR_URL="Mostra URL Pagina Facebook"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_USE_AUTHOR_URL_DESC="Questa opzione consente agli autori di inserire il proprio URL della pagina Facebook. Quando un post viene condiviso su Facebook, il post di Facebook viene collegato alla sua pagina Facebook."
COM_EB_SETTINGS_SOCIALSHARE_LINKEDIN_OAUTH_REDIRECT_URI_DESC="Copia questi oauth redirect uri e imposta nella tua app Linkedin <b> Oauth 2.0 URL di reindirizzamento campi autorizzati </b> "
