MOD_EASYBLOG_TRUNCATE_COMMENT="Commenti Troncati"
MOD_EASYBLOG_TRUNCATE_COMMENT_DESC="Questa opzione determina se il commento dovrebbe essere troncato nel modulo. Il valore dell'idea sarebbe di 200-300 caratteri. Impostazioni a 0 disattivano completamente il troncamento."
