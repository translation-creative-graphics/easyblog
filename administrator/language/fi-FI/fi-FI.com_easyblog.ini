COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS="Laajuusluvat"
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_DESC="Nämä laajuusluvat sallivat EasyBlogin lähettämään blogisisällön automaattisesti Facebook-sivuille ja -ryhmiin. Valitse käyttöoikeudet, joita haluat käyttää. <br />Jos Facebook-sovelluksesi on julkisessa tilassa, varmista, että Facebook on jo hyväksynyt valitut oikeudet, ennen kuin käytät niitä alla olevassa todennusprosessissa."
COM_EB_SETTINGS_SOCIALSHARE_FACEBOOK_SCOPE_PERMISSIONS_INFO="Facebook on päivittänyt Page API -sovelluksensa <b>6.5.2020</b> ja julkaissut kuusi uutta sivuoikeutta korvataksesi <b>publish_pages</b> ja <b>manage_pages</b>.<br \\>. Facebook-sivujen automaattiseen lähettämiseen tarvitset <b>pages_manage_posts</b> ja <b>pages_read_engagement</b> käyttöoikeudet. Tämä on Facebook-sovelluksille, jotka on luotu <b>. 6.5.2020</b> jälkeen. Sovellukset, jotka on luotu <b>ennen 6.5.2020</b>, voivat elleen käyttää vanhoja käyttöikeuksia <b>9. toukokuuta 2022</b>asti.<br \\>Lisätietoja saat <a href='https://developers.facebook.com/docs/pages/overview-1#deprecated-permissions' target='_blank'>sivulta</a>."
