COM_EASYBLOG_RECONFIGURE_NEW_CATEGORY_LABEL="Nieuwe hoofdcategorie toewijzen"
COM_EASYBLOG_BLOGS_RECONFIGURE_CATEGORIES_SUCCESS="De categorieën van %1s blogberichten zijn met succes aangepast."
COM_EASYBLOG_BLOGS_RECONFIGURE_CATEGORIES_ERROR="Er is een fout opgetreden bij het opnieuw configureren van de categorieën voor deze blogberichten."
COM_EASYBLOG_RECONFIGURE_NEW_CATEGORY_REQUIRED="Kies alstublieft een nieuwe hoofdcategorie voordat u uw bericht verstuurt. Een bericht kan niet worden geplaatst zonder categorie."
COM_EASYBLOG_SETTINGS_COMMENTS_EASYDISCUSS="CRE8 Discussie"
COM_EASYBLOG_SETTINGS_COMMENTS_EASYDISCUSS_DESC="Als deze optie is ingeschakeld, wordt de plug-in ‘CRE8 Discuss comments’ in het reactiegedeelte geladen."
COM_EASYBLOG_SETTINGS_COMMENTS_EASYDISCUSS_NOT_INSTALLED="De CRE8 Discuss-reactieplugin is niet geïnstalleerd."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_NOTIFICATIONS_NEW_BLOG_DESC="Wanneer er een nieuw blogbericht wordt geplaatst, stuurt CRE8 Blog een melding naar gebruikers die zich via CRE8 Discuss-meldingen hebben geabonneerd op de site en de categorie."
COM_EASYDISCUSS_TRY_BUTTON="Haal CRE8 Discuss vandaag nog in huis!"
COM_EASYBLOG_SETTINGS_LAYOUT_AVATAR_INTEGRATIONS_EASYDISCUSS="CRE8 Discussie"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_SUBTAB_EASYSOCIAL="CRE8 Social"
COM_EASYBLOG_EASYSOCIAL_INFO="CRE8 Social is een revolutionaire uitbreiding voor sociale netwerken voor Joomla! Het bevat een supergaaf profielsysteem, een vriendensysteem, gesprekken en talloze andere functies. CRE8 Social helpt je zeker bij het bouwen van een geweldige sociale-netwerksite met Joomla!"
COM_EASYBLOG_SIGNUP_WITH_EASYSOCIAL="Haal CRE8 Social nu in huis!"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_GENERAL_DESC="Algemene integratie met CRE8 Social vind je in dit gedeelte"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR="CRE8-balk voor sociale meldingen weergeven"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR_DESC="Als deze optie is ingeschakeld, wordt de meldingsbalk van CRE8 Social boven de werkbalk van CRE8 Blog weergegeven."
COM_EASYBLOG_SETTINGS_COMMENTS_EASYSOCIAL_COMMENTS="CRE8 Social-reacties"
COM_EASYBLOG_SETTINGS_COMMENTS_EASYSOCIAL_COMMENTS_DESC="Indien ingeschakeld, maakt het systeem gebruik van het reactiesysteem van CRE8 Social"
COM_EASYBLOG_EASYSOCIAL_NOTIFICATIONS_INFO="Met de meldingsinstellingen kun je instellen hoe de integratie van meldingen met CRE8 Social moet werken."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_NEW_COMMENT_DESC="Als deze optie is ingeschakeld, krijgen abonnees van het blogbericht via het interne meldingssysteem van CRE8 Social een melding wanneer er een nieuwe reactie op het blogbericht wordt geplaatst."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_COMMENT_REPLY_DESC="Als deze optie is ingeschakeld, krijgt de auteur van de reactie via het interne meldingssysteem van CRE8 Social een melding wanneer er op zijn reactie op het blogbericht wordt gereageerd."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_NEW_RATING_DESC="Als deze optie is ingeschakeld, krijgen abonnees van het blogbericht via het interne meldingssysteem van CRE8 Social een melding wanneer er een nieuwe beoordeling aan het blogbericht wordt toegekend."
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_NOTIFICATIONS_NEW_REACTION_DESC="Als deze optie is ingeschakeld, krijgt de auteur van het blogbericht via het interne meldingssysteem van CRE8 Social een melding wanneer er een nieuwe reactie op het blogbericht wordt geplaatst."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_PROFILE_MODIFY_EDIT_PROFILE_LINK="Gebruik de CRE8 Social-link ‘Profiel bewerken’"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_PROFILE_MODIFY_EDIT_PROFILE_LINK_DESC="Als deze optie is ingeschakeld, koppelt CRE8 Blog de link ‘Profiel bewerken’ aan het formulier van CRE8 Social."
COM_EASYBLOG_EASYSOCIAL="CRE8 Social"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_SEARCH_DESC="Stel het zoekgedrag voor blogs in CRE8 Social in"
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_INDEXER_INDEX_NEW_POST_DESC="Indien deze optie is ingeschakeld, worden nieuwe blogberichten toegevoegd aan de indexer van CRE8 Social."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_INDEXER_INDEX_NEW_POST_LENGTH_DESC="Geef de lengte op van de inhoud die in de indexer van CRE8 Social moet worden geïndexeerd."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYSOCIAL_MEDIA_INFO="Met CRE8 Blog kun je de albums van je gebruikers in CRE8 Social integreren in de mediabeheerder van CRE8 Blog. Door deze optie in te schakelen, kunnen gebruikers albums als galerij insluiten of foto’s uit hun albums insluiten."
COM_EASYBLOG_SETTINGS_TOOLBAR_EASYSOCIAL_USE_MODULE_INFO="Deze optie wordt niet meer ondersteund. Stel de <b>CRE8 Social Toolbar-module</b> zo in dat deze wordt weergegeven op de positie <b>easyblog-before-toolbar</b>."
COM_EASYBLOG_INSTALLATION_SITE_MENU_EXISTS="Het sitemenu voor CRE8 Social bestaat al. Dit overslaan."
COM_EASYBLOG_SETTINGS_COMPOSER_POST_OPTIONS_CATEGORY_MOVE_DATE="Wijziging van de datum van verplaatsing van een categorie toestaan"
COM_EASYBLOG_SETTINGS_COMPOSER_POST_OPTIONS_CATEGORY_MOVE_DATE_DESC="Met deze optie kan de auteur instellen of het bericht op een later tijdstip automatisch naar een andere categorie kan worden verplaatst, zonder dat het daarbij uit de publicatie wordt gehaald of wordt gearchiveerd."
COM_EB_SETTINGS_DASHBOARD_HEADER_OFFSET_DESC="Bepaal de positie-offset van de affix-header ten opzichte van de bovenkant van de pagina. Pas de offset (in pixels) aan als de site een vast element bovenaan bevat, zoals de Docker-werkbalk van CRE8 Social."
COM_EB_SETTINGS_READING_PROGRESS_OFFSET_DESC="Bepaal de positie ten opzichte van de bovenkant van de pagina. Pas de positie (in pixels) aan als de site een vast element bovenaan bevat, zoals de Docker-werkbalk van CRE8 Social."
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR="CRE8 Social Menu's weergeven in de CRE8 Blog-werkbalk"
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_TOOLBAR_DESC="Deze optie bepaalt of de menu-items van CRE8 Social moeten worden weergegeven in het uitklapmenu van CRE8 Blog in de werkbalk"
COM_EB_SETTINGS_INTEGRATIONS_EASYDISCUSS_TOOLBAR="CRE8-menu’s weergeven in de CRE8-blogwerkbalk"
COM_EB_SETTINGS_INTEGRATIONS_EASYDISCUSS_TOOLBAR_DESC="Deze optie bepaalt of de menu-items van CRE8 Discuss moeten worden weergegeven in het uitklapmenu van CRE8 Blog in de werkbalk"
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_PRIVACY="Gebruik ‘Privacy’ van CRE8 Social"
COM_EB_SETTINGS_INTEGRATIONS_EASYSOCIAL_PRIVACY_DESC="Deze optie bepaalt of de privacy-instelling van CRE8 Social ook in CRE8 Blog moet worden overgenomen"
COM_EB_SETTINGS_INTEGRATION_EASYSOCIAL_STREAM_DESC="Stel het algemene gedrag van de streamblog in CRE8 Social in"
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_TITLE="Privacy met betrekking tot externe inhoud"
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_INFO="Bepaal zelf hoe ingesloten inhoud van diensten van derden (YouTube, TikTok, X, Facebook, Instagram en andere) op je blog wordt weergegeven."
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_CONSENT_ENABLE="Externe/insluitbare inhoud maskeren"
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_CONSENT_ENABLE_DESC="Wanneer deze optie is ingeschakeld, worden insluitbare blokken (YouTube, TikTok, X, Facebook, Instagram, Vimeo en andere) vervangen door een plaatshouder en wordt de daadwerkelijke inhoud van derden pas geladen nadat een bezoeker er expliciet op heeft geklikt om deze te bekijken. Dit geldt voor elk bericht op de site, inclusief berichten die zijn gepubliceerd voordat deze optie werd ingeschakeld."
COM_EASYBLOG_SETTINGS_EXTERNAL_CONTENT_CONSENT_ENABLE_NOTE="<b>Aanbevolen om te voldoen aan de voorschriften inzake gegevensbescherming (AVG).</b> Er wordt geen verzoek naar de externe dienst verzonden en er worden geen cookies door deze dienst geplaatst, totdat de bezoeker klikt om de inhoud te laden."
COM_EB_ASSOCIATION_MISSING="Dit bericht moet aan een team, pagina, groep of evenement zijn gekoppeld – een categorie of tag alleen volstaat hiervoor niet. Stel het bericht in plaats daarvan in op ‘privé’ als het niet aan een van deze koppelingen moet zijn gekoppeld."
COM_EB_MIGRATOR_JOOMLA_MIGRATE_IMAGES="Afbeeldingen naar de mediamaap van het bericht kopiëren"
COM_EB_MIGRATOR_JOOMLA_MIGRATE_IMAGES_DESC="Kopieert de inleidende afbeelding van het artikel (of de afbeelding van de volledige tekst) en alle lokale afbeeldingen in de tekst naar de eigen mediamap van het bericht, en verwijst het bericht naar deze kopieën. De originele bestanden blijven op hun plaats staan."
COM_EB_MIGRATOR_JOOMLA_IMAGE_MISSING="Afbeelding niet gevonden, originele link behouden: %1$s (bericht %2$s)"
COM_EB_MIGRATOR_JOOMLA_IMAGE_FAILED="Afbeelding kon niet worden gekopieerd, originele link behouden: %1$s (bericht %2$s)"
COM_EB_MIGRATOR_JOOMLA_ARTICLE_FAILED="De migratie is gestopt bij het Joomla-artikel %1$s: %2$s"
COM_EB_SETTINGS_TRUNCATION_SPLIT_POSTS="Ook berichten inkorten met ‘Lees meer’"
COM_EB_SETTINGS_TRUNCATION_SPLIT_POSTS_DESC="Berichten met een ‘lees meer’-scheidingslijn tonen normaal gesproken hun volledige inleiding in de lijstweergave. Schakel deze optie in om ook die inleiding af te kappen wanneer deze de afkappingslimiet overschrijdt."
