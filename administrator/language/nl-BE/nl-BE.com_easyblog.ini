COM_EASYBLOG_RECONFIGURE_CATEGORIES_CONTENT="Verwijder de geselecteerde berichten uit de onderstaande categorieën, voeg eventueel extra categorieën toe en kies vervolgens de nieuwe hoofdcategorie. Alle wijzigingen worden in één stap doorgevoerd."
