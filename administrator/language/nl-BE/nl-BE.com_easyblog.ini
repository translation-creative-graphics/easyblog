COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_NOTIFICATIONS_DESC="Dankzij live meldingen in CRE8 Discuss verschijnt een nieuw meldingsitem in CRE8 Discuss zonder dat de pagina opnieuw hoeft te worden geladen."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_DESC="CRE8 Discuss is een vraag-en-antwoordmodule voor Joomla. Installeer eerst het installatieprogramma voor de regels van CRE8 Discuss voordat u deze opties inschakelt."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_POINTS_DESC="Indien deze functie is ingeschakeld, zal CRE8 Blog proberen punten toe te voegen in CRE8 Discuss wanneer bepaalde acties worden geactiveerd."
COM_EASYBLOG_SETTINGS_INTEGRATIONS_EASYDISCUSS_BADGES_DESC="Indien ingeschakeld, zal CRE8 Blog proberen om in CRE8 Discuss badges voor de gebruiker toe te voegen wanneer bepaalde acties worden geactiveerd."
