MOD_EASYBLOG_POST_DURATION_DESC="Προσδιορίστε εάν οι δημοφιλέστερες αναρτήσεις θα πρέπει να βασίζονται σε συγκεκριμένη διάρκεια ή προεπιλεγμένη συμπεριφορά. Η προεπιλεγμένη συμπεριφορά θα εμφανίζει πάντα τις πιο δημοφιλείς θέσεις ανεξάρτητα από το πόσο χρονικό διάστημα δημιουργήθηκαν οι θέσεις."
