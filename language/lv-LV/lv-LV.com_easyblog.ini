COM_EASYBLOG_COMPOSER_CATEGORY_MOVE_DATE_DESC="Ja vēlaties, lai šis ieraksts nākotnē tiktu automātiski pārvietots uz citu kategoriju (piemēram, lai pasākuma ieraksts tiktu pārvietots ārpus kategorijas „Pasākumi”, kad tas būs beidzies), neatsaucot tā publicēšanu vai neievietojot to arhīvā, zemāk norādiet datumu un jauno kategoriju. Lai pārvietošana stātos spēkā, ir jānorāda abi šie parametri."
COM_EASYBLOG_COMPOSER_CATEGORY_MOVE_TARGET_DESC="Kategorija, uz kuru šis ieraksts tiks pārvietots, kad būs pienācis iepriekš minētais pārvietošanas datums. Var izvēlēties tikai augstākā līmeņa kategorijas — apakškategorijas nav iekļautas."
COM_EB_ASSOCIATION_MISSING="Šim ierakstam ir jābūt saistītam ar komandu, lapu, grupu vai pasākumu — viena kategorija vai viena atslēgvārda vien nepietiek. Ja ierakstam nevajadzētu būt saistītam ar kādu no šiem elementiem, iestatiet to kā privātu."
